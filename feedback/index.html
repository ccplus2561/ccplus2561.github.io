  </div>
  <a class="skip-link" href="#main">跳至主要內容</a>
  <header class="site-header" id="top">
    <div class="nav-shell">
      <a class="brand" href="/" aria-label="加加研究室大廳">
        <img src="/assets/images/ccplus2561_logo.png" alt="" width="44" height="44">
        <span class="brand-copy"><strong>加加研究室</strong><small>CCPLUS2561</small></span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="開啟導覽選單"><span></span><span></span><span></span></button>
      <nav class="site-nav" id="site-nav" aria-label="主選單">
        <a class="nav-link" href="/">大廳</a>
        <a class="nav-link" href="/projects/">MiniHub 遊戲中心</a>

        <a class="nav-link is-current" href="/feedback/">意見回報</a>
        <button class="theme-toggle" type="button" aria-label="切換深色模式" title="切換深色模式">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 15.3A8.5 8.5 0 0 1 8.7 3.7 8.6 8.6 0 1 0 20.3 15.3Z"/></svg>
        </button>
      </nav>
    </div>
  </header>
  <main id="main" class="projects-page feedback-page">
    <section class="page-hero page-width" aria-labelledby="page-title">
      <a class="back-lobby back-lobby-btn" href="/"><span class="back-arrow" aria-hidden="true">←</span>回到大廳</a>
      <div class="mh-hero">
        <div class="mh-hero-logo tools-hero-icon tools-hero-feedback" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M9 11.5A3.5 3.5 0 0 1 12.5 8h23a3.5 3.5 0 0 1 3.5 3.5v17a3.5 3.5 0 0 1-3.5 3.5H21l-8 7v-7h-.5A3.5 3.5 0 0 1 9 28.5v-17Z"/><path d="M24 14.5v8m0 4.2v.3"/></svg></div>
        <div class="mh-hero-copy">
          <h1 id="page-title">意見回報</h1>
          <p>遇到錯誤、有想法或想許願新功能，都可以在這裡告訴我。</p>
        </div>
      </div>
    </section>
    <section class="projects-section page-width content-section" aria-label="回報表單">
      <form class="fb-card" id="fb-form" novalidate>
        <div class="fb-row">
          <label class="fb-field"><span class="fb-label">相關項目</span><select name="target" id="fb-target"><option>大廳首頁</option><option>MiniHub 遊戲中心</option><option>兵果大廳</option><option>OOXX 圈圈叉叉</option><option>BLOCKDROP 俄羅斯方塊</option><option>AGAR ARENA 細胞遊戲</option><option>其他 / 整個網站</option></select></label>
          <label class="fb-field"><span class="fb-label">標題</span><input type="text" name="title" id="fb-title" maxlength="80" placeholder="一句話說明問題或想法" required></label>
        </div>
        <label class="fb-field"><span class="fb-label">詳細內容</span><textarea name="body" id="fb-body" rows="6" maxlength="3000" placeholder="發生什麼事？怎麼操作會出現？你希望變成什麼樣子？" required></textarea></label>
        <div class="fb-row">
          <label class="fb-field"><span class="fb-label">裝置 / 瀏覽器（自動填入，可修改）</span><input type="text" name="env" id="fb-env" maxlength="160"></label>
          <label class="fb-field"><span class="fb-label">聯絡方式（選填，內容會公開）</span><input type="text" name="contact" id="fb-contact" maxlength="80" placeholder="想收到回覆才需要填寫"></label>
        </div>
        <p class="fb-note" id="fb-note">送出後會開啟 GitHub 的新議題頁面，內容已幫你填好，確認後按「Submit new issue」即可（需 GitHub 帳號，內容為公開）。請勿填寫密碼或個人隱私。</p>
        <div class="fb-actions">
          <button class="mh-cta fb-submit" type="submit"><span id="fb-submit-text">送出回報</span> <b aria-hidden="true">↗</b></button>
          <button class="fb-copy" type="button" id="fb-copy">複製內容</button>
          <span class="fb-status" id="fb-status" role="status" aria-live="polite"></span>
        </div>
      </form>
    </section>
  </main>
  <footer class="site-footer">
    <div class="page-width footer-inner footer-simple">
      <p>© 加加研究室</p>
    </div>
  </footer>
