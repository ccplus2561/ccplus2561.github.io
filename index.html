<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加加研究室 - 專案大廳</title>
<meta name="description" content="加加研究室（程式創造++）專案入口：教學部落格、MiniHub 遊戲平台與更多作品。">
<link rel="icon" type="image/png" href="ccplus2561_logo.png">
<style>
  :root{--p:#007bc7;--pd:#005a93;--bg:#f4f6f9;--card:#fff;--text:#2c3e50;--muted:#666}
  @media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#1a232d;--text:#e8eef4;--muted:#9fb0c0}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
  header{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;text-align:center;padding:44px 20px 56px}
  header img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:22px;padding:10px;
    box-shadow:0 8px 20px rgba(0,0,0,.25)}
  header h1{margin-top:14px;font-size:1.7rem;letter-spacing:1px}
  header p{margin-top:6px;opacity:.88;font-size:.95rem}
  main{max-width:960px;margin:-30px auto 0;padding:0 18px 40px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  .card{display:flex;flex-direction:column;gap:8px;background:var(--card);border-radius:20px;padding:24px;
    text-decoration:none;color:inherit;box-shadow:0 10px 28px rgba(0,90,147,.15);
    transition:transform .18s,box-shadow .18s}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(0,90,147,.25)}
  .card .ico{font-size:2.2rem}
  .card h2{font-size:1.2rem;color:var(--p)}
  .card p{font-size:.9rem;line-height:1.65;color:var(--muted);flex:1}
  .card .go{font-size:.85rem;font-weight:600;color:var(--p)}
  .card.soon{opacity:.6;pointer-events:none;border:2px dashed rgba(0,123,199,.35);box-shadow:none}
  footer{text-align:center;padding:10px 0 30px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
  <header>
    <img src="ccplus2561_logo.png" alt="加加研究室">
    <h1>加加研究室</h1>
    <p>程式創造++ ｜ 創客教學與作品入口</p>
  </header>

  <main>
    <!-- ★ 新增專案：複製一個 <a class="card"> 區塊，改 href / 標題 / 說明即可 -->
    <a class="card" href="/blog/">
      <div class="ico">📖</div>
      <h2>教學部落格</h2>
      <p>Arduino、Python、LINE Bot、Android、YouTube 影片講義…完整創客教學文章。</p>
      <span class="go">進入部落格 →</span>
    </a>

    <a class="card" href="/MiniHub/">
      <div class="ico">🎮</div>
      <h2>MiniHub 遊戲平台</h2>
      <p>純網頁的線上遊戲中心，免安裝、開了就玩。</p>
      <span class="go">開始遊玩 →</span>
    </a>

    <div class="card soon">
      <div class="ico">🧩</div>
      <h2>更多專案</h2>
      <p>新作品開發中，敬請期待。</p>
      <span class="go">Coming soon</span>
    </div>
  </main>

  <footer>© 加加研究室 - 創客教學網頁</footer>
</body>
</html>
