  <!-- 資料載入說明：
       Data.js／Post.js 已改為一般 JavaScript 檔案，並在 <head> 最上方
       以 <script src="./Data.js"> 與 <script src="./Post.js"> 直接載入
       （見本檔案第 10～11 行），此寫法本機（VS Code / Live Server）與
       GitHub（GitHub Pages）皆可直接運作，不需再判斷執行環境或另外抓取。
       原本用來相容 Google Apps Script（HtmlService 樣板標記／google.script
       偵測）的區塊已隨網站遷移至 GitHub 一併移除。 -->

  <script>
    const THEME_PALETTES = [
      { primary: "#1976d2", dark: "#0d47a1", glow: "rgba(25, 118, 210, 0.25)", bgFrom: "#e7f1fc", bgTo: "#eef1fb", card: "#f6faff" },
      { primary: "#2e7d32", dark: "#1b5e20", glow: "rgba(46, 125, 50, 0.25)", bgFrom: "#e8f6ea", bgTo: "#eef7f1", card: "#f6fbf7" },
      { primary: "#7b1fa2", dark: "#4a148c", glow: "rgba(123, 31, 162, 0.22)", bgFrom: "#f2e9fb", bgTo: "#eee7fa", card: "#faf6ff" },
      { primary: "#00897b", dark: "#00695c", glow: "rgba(0, 137, 123, 0.22)", bgFrom: "#e4f5f2", bgTo: "#eaf4f6", card: "#f3fbfa" },
      { primary: "#e64a19", dark: "#bf360c", glow: "rgba(230, 74, 25, 0.2)", bgFrom: "#fdece4", bgTo: "#fdefe9", card: "#fff8f4" },
      { primary: "#ad1457", dark: "#880e4f", glow: "rgba(173, 20, 87, 0.2)", bgFrom: "#fbe8f0", bgTo: "#f7e9f3", card: "#fff5f9" },
      { primary: "#3949ab", dark: "#283593", glow: "rgba(57, 73, 171, 0.22)", bgFrom: "#ebeefb", bgTo: "#ede8fa", card: "#f6f7ff" },
      { primary: "#ef6c00", dark: "#e65100", glow: "rgba(239, 108, 0, 0.2)", bgFrom: "#fdf1e2", bgTo: "#fdeddf", card: "#fffaf3" },
      { primary: "#00838f", dark: "#006064", glow: "rgba(0, 131, 143, 0.25)", bgFrom: "#e4f4f6", bgTo: "#e9f2f5", card: "#f2fafc" },
      { primary: "#6d4c41", dark: "#4e342e", glow: "rgba(109, 76, 65, 0.2)", bgFrom: "#f2ece8", bgTo: "#f5efe9", card: "#faf6f2" },
      { primary: "#455a64", dark: "#263238", glow: "rgba(69, 90, 100, 0.22)", bgFrom: "#eaeef0", bgTo: "#eef1f3", card: "#f5f8f9" },
      { primary: "#5d4037", dark: "#3e2723", glow: "rgba(93, 64, 55, 0.2)", bgFrom: "#f1eae7", bgTo: "#f4eeeb", card: "#faf7f5" },
      { primary: "#0277bd", dark: "#014a7f", glow: "rgba(2, 119, 189, 0.22)", bgFrom: "#e5f1f9", bgTo: "#ecf3fa", card: "#f4faff" },
      { primary: "#558b2f", dark: "#33691e", glow: "rgba(85, 139, 47, 0.2)", bgFrom: "#eef5e7", bgTo: "#f1f6ec", card: "#f7fbf3" },
      { primary: "#6a1b9a", dark: "#38006b", glow: "rgba(106, 27, 154, 0.2)", bgFrom: "#f0e8f8", bgTo: "#ede6f6", card: "#f9f5fc" },
      { primary: "#00695c", dark: "#004d40", glow: "rgba(0, 105, 92, 0.22)", bgFrom: "#e3f2ef", bgTo: "#e9f3f1", card: "#f2faf8" },
      { primary: "#8d6e63", dark: "#5d4037", glow: "rgba(141, 110, 99, 0.2)", bgFrom: "#f2ece9", bgTo: "#f5efec", card: "#faf7f5" },
      { primary: "#5c6bc0", dark: "#3949ab", glow: "rgba(92, 107, 192, 0.2)", bgFrom: "#eceefb", bgTo: "#eeecfa", card: "#f6f7ff" },
      { primary: "#c62828", dark: "#8e0000", glow: "rgba(198, 40, 40, 0.18)", bgFrom: "#fbeae9", bgTo: "#fbecec", card: "#fff6f5" },
      { primary: "#37474f", dark: "#1c262b", glow: "rgba(55, 71, 79, 0.22)", bgFrom: "#e9edee", bgTo: "#ecf0f1", card: "#f4f7f8" }
    ];

    let navigationStack = [];
    let currentMode = 'mobile';

    const appContent = document.getElementById('appContent');
    const headerTitle = document.getElementById('headerTitle');
    const backBtn = document.getElementById('backBtn');
    const searchContainer = document.getElementById('searchContainer');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const noticeModal = document.getElementById('noticeModal');
    const noticeModalBody = document.getElementById('noticeModalBody');
    const appContainer = document.getElementById('appContainer');
    const mainColumn = document.querySelector('.main-column');
    const modeModal = document.getElementById('modeModal');
    const moreDropdown = document.getElementById('moreDropdown');
    const desktopNoticeBtn = document.getElementById('desktopNoticeBtn');
    const headerActions = document.querySelector('.header-actions');
    const sidebarNav = document.getElementById('sidebarNav');
    const navHomeBtn = document.getElementById('navHomeBtn');
    const navSearchBtn = document.getElementById('navSearchBtn');

    function applyRandomTheme() {
      const randomPalette = THEME_PALETTES[Math.floor(Math.random() * THEME_PALETTES.length)];
      document.documentElement.style.setProperty('--primary-color', randomPalette.primary);
      document.documentElement.style.setProperty('--primary-dark', randomPalette.dark);
      document.documentElement.style.setProperty('--accent-glow', randomPalette.glow);
      document.documentElement.style.setProperty('--card-bg', randomPalette.card);
      const gradient = `linear-gradient(165deg, ${randomPalette.bgFrom} 0%, ${randomPalette.bgTo} 100%)`;
      document.documentElement.style.setProperty('--bg-color', gradient);
      if (appContainer) appContainer.style.background = gradient;
    }

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(15);
    }

    function createRipple(event, element) {
      const circle = document.createElement('span');
      const diameter = Math.max(element.clientWidth, element.clientHeight);
      const radius = diameter / 2;
      const rect = element.getBoundingClientRect();
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${event.clientX - rect.left - radius}px`;
      circle.style.top = `${event.clientY - rect.top - radius}px`;
      circle.classList.add('ripple');
      const ripple = element.getElementsByClassName('ripple')[0];
      if (ripple) ripple.remove();
      element.appendChild(circle);
    }

    function chooseMode(mode) {
      switchMode(mode);
      modeModal.classList.remove('active');
    }

    function switchMode(mode) {
      currentMode = mode;
      closeMoreMenu();

      if (mode === 'desktop') {
        document.body.classList.add('desktop-mode');
        headerActions.insertBefore(searchContainer, desktopNoticeBtn);
        searchContainer.classList.add('desktop-inline');
        if (searchInput.value.trim() === '') {
          searchContainer.classList.remove('active');
        }
      } else {
        document.body.classList.remove('desktop-mode');
        mainColumn.insertBefore(searchContainer, appContent);
        searchContainer.classList.remove('desktop-inline');
        if (searchInput.value.trim() === '') {
          searchContainer.classList.remove('active');
        }
      }

      // 切換模式後，底部導覽列顯示/隱藏狀態改變，重新量測留白高度
      requestAnimationFrame(setBottomNavSpace);
      fitHeaderTitle();

      // 切回電腦版時，交還給 CSS 內建的 82vh 高度；切回手機版則重新計算，
      // 避免殘留另一種模式算出來的高度
      const pdfContainer = appContent.querySelector('.pdf-viewer-container');
      if (pdfContainer) {
        if (mode === 'desktop') {
          pdfContainer.style.height = '';
        } else {
          fitPdfViewerHeight();
        }
      }
    }

    function toggleMoreMenu(event) {
      if (event) event.stopPropagation();
      moreDropdown.classList.toggle('active');
    }

    function closeMoreMenu() {
      moreDropdown.classList.remove('active');
    }

    document.addEventListener('click', function (e) {
      const menu = document.querySelector('.more-menu');
      if (menu && !menu.contains(e.target)) closeMoreMenu();
    });

    // 手機版標題若文字過長，因為置中顯示，左右兩側容易被返回鈕/按鈕擋住而看不全；
    // 這裡改為依實際可用寬度自動縮小字體，讓標題盡量完整顯示、且不擋到左右按鈕
    function fitHeaderTitle() {
      if (!headerTitle) return;
      const headerEl = headerTitle.closest('header');
      if (!headerEl) return;

      if (document.body.classList.contains('desktop-mode')) {
        // 電腦版標題不置中、版面較寬，交還給原本的 CSS 規則即可
        headerTitle.style.maxWidth = '';
        headerTitle.style.fontSize = '';
        return;
      }

      const headerWidth = headerEl.clientWidth;
      if (!headerWidth) return;

      const backVisible = backBtn && getComputedStyle(backBtn).display !== 'none';
      const leftReserve = (backVisible ? backBtn.offsetWidth : 0) + 14;

      const actionsVisible = headerActions && headerActions.offsetWidth > 0 && getComputedStyle(headerActions).display !== 'none';
      const rightReserve = (actionsVisible ? headerActions.offsetWidth : 0) + 14;

      // 標題以整個 header 寬度置中，所以兩側都要留出「較寬那一邊」的安全距離，避免擋住任一顆按鈕
      const sideReserve = Math.max(leftReserve, rightReserve, 14);
      const available = Math.max(60, headerWidth - sideReserve * 2);

      headerTitle.style.maxWidth = `${available}px`;

      // 手機版 header 高度固定 56px，空間相當足夠，原本 1.1rem 的上限
      // 只依「寬度夠不夠」去縮，完全沒利用到多餘的高度，字看起來偏小；
      // 這裡把可用的最大字級調高，讓大多數短標題能用更大字顯示，
      // 真的放不下時才依現有邏輯逐步縮小到 minFontRem。
      const maxFontRem = 1.3;
      const minFontRem = 0.8;
      let fontSize = maxFontRem;
      headerTitle.style.fontSize = `${fontSize}rem`;

      let guard = 0;
      while (headerTitle.scrollWidth > headerTitle.clientWidth && fontSize > minFontRem && guard < 30) {
        fontSize = Math.max(minFontRem, fontSize - 0.03);
        headerTitle.style.fontSize = `${fontSize.toFixed(2)}rem`;
        guard++;
      }
      // 若已縮到最小字體仍放不下，交由既有的 overflow:hidden + ellipsis 處理，避免無限縮小到無法閱讀
    }

    // 標題文字由多處直接以 innerText 賦值更新，統一用 MutationObserver 監聽變化並自動重新計算，
    // 不必逐一修改每個設定標題的地方
    if (typeof MutationObserver !== 'undefined' && document.getElementById('headerTitle')) {
      const headerTitleObserver = new MutationObserver(() => {
        requestAnimationFrame(fitHeaderTitle);
      });
      headerTitleObserver.observe(document.getElementById('headerTitle'), { childList: true, characterData: true, subtree: true });
    }

    window.addEventListener('resize', () => requestAnimationFrame(fitHeaderTitle));
    window.addEventListener('orientationchange', () => requestAnimationFrame(fitHeaderTitle));

    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
    }
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);

    // 手機版底部導覽列改為 fixed 後，量測其實際高度（含安全區）回填為內容底部留白，
    // 避免內容（包含最後正常文件流中的 footer 版權文字）被固定導覽列擋住
    function setBottomNavSpace() {
      const nav = document.getElementById('bottomNav');
      if (!nav) return;
      if (document.body.classList.contains('desktop-mode')) return;
      const navH = nav.offsetHeight;
      if (navH <= 0) return;
      // 多留 2px 緩衝：量測當下如果圖示字型還沒套用完成，量到的高度會比
      // 字型換上後稍微小一點，footer 文字就可能被半透明模糊的導覽列蓋到
      // 邊緣一點點而變得模糊、幾乎看不見，留一點緩衝可以避免這種邊界誤差
      document.documentElement.style.setProperty('--bottom-nav-height', `${navH + 2}px`);
    }
    window.addEventListener('resize', setBottomNavSpace);
    window.addEventListener('orientationchange', setBottomNavSpace);
    window.addEventListener('resize', fitPdfViewerHeight);
    window.addEventListener('orientationchange', fitPdfViewerHeight);

    // Font Awesome 圖示字型是外部載入的，若導覽列量測當下字型還沒真正套用
    // 完成，量到的高度會比字型換上後的實際高度小；字型就緒後再重新量一次，
    // 確保底部留白最終是正確的高度，footer 才不會被導覽列蓋到
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        setBottomNavSpace();
        fitPdfViewerHeight();
      }).catch(() => {});
    }

    // 導覽列本身的尺寸如果因任何原因（字型、安全區、瀏覽器網址列收合等）
    // 產生變化，用 ResizeObserver 即時同步，比只靠 resize/orientationchange
    // 事件更可靠，避免留白高度跟導覽列實際高度對不上
    if (typeof ResizeObserver !== 'undefined') {
      const bottomNavEl = document.getElementById('bottomNav');
      if (bottomNavEl) {
        const navResizeObserver = new ResizeObserver(() => {
          setBottomNavSpace();
          fitPdfViewerHeight();
        });
        navResizeObserver.observe(bottomNavEl);
      }
    }

    // 網頁公告紅點：跟「選擇電腦版/手機版」一樣，每次重新進入網頁都要顯示，
    // 不記憶上次是否已讀（不使用 localStorage 長期保存已讀狀態）
    let noticeUnread = true;

    function refreshNoticeBadge() {
      const badges = [document.getElementById('noticeBadgeDesktop'), document.getElementById('noticeBadgeMobile')];
      badges.forEach(b => { if (b) b.style.display = noticeUnread ? 'block' : 'none'; });
    }

    function markNoticeAsRead() {
      noticeUnread = false;
      refreshNoticeBadge();
    }

    function openNoticeModal() {
      markNoticeAsRead();
      if (typeof postData === 'undefined' || postData.length === 0) {
        noticeModalBody.innerHTML = `<div class="empty-state"><p>目前沒有公告！</p></div>`;
      } else {
        let html = "";
        postData.forEach((item, index) => {
          const isExpandedClass = item.isExpanded ? "expanded" : "";

          html += `
            <div class="post-version-group ${isExpandedClass}" id="postGroup-${index}">
              <div class="post-version-header" onclick="togglePostAccordion(${index})">
                <span class="post-version-title">${item.version}</span>
                <i class="fa-solid fa-caret-down post-version-arrow"></i>
              </div>
              <div class="post-version-content">
          `;

          if (item.logs && item.logs.length > 0) {
            item.logs.forEach(log => {
              html += `
                <div class="post-log-card">
                  <div class="post-log-tag">${log.tag}：${log.title}</div>
                  <div class="post-log-text">${log.content}</div>
                </div>
              `;
            });
          }

          html += `
              </div>
            </div>
          `;
        });
        noticeModalBody.innerHTML = html;
      }

      noticeModal.classList.add('active');
    }

    function togglePostAccordion(index) {
      triggerHaptic();
      const targetGroup = document.getElementById(`postGroup-${index}`);
      if (targetGroup) {
        targetGroup.classList.toggle('expanded');
      }
    }

    function closeNoticeModal() {
      noticeModal.classList.remove('active');
    }

    function closeNoticeModalOnOverlay(event) {
      if (event.target === noticeModal) {
        closeNoticeModal();
      }
    }

    function toggleSearch() {
      if (searchContainer.classList.contains('active')) {
        searchContainer.classList.remove('active');
        if (navSearchBtn) navSearchBtn.classList.remove('active');
        clearSearch();
      } else {
        searchContainer.classList.add('active');
        if (navSearchBtn) navSearchBtn.classList.add('active');
        searchInput.focus();
      }
    }

    function renderSidebarNav() {
      if (!sidebarNav || typeof courseData === 'undefined') return;
      let html = `<div class="sidebar-item active" data-nav-home="1" onclick="triggerHaptic(); sidebarGoHome();"><i class="fa-solid fa-house"></i><span>總覽首頁</span></div><div class="sidebar-divider"></div>`;
      
      courseData.forEach(book => {
        html += `
          <div class="sidebar-book-group" id="sidebarBookGroup-${book.id}">
            <div class="sidebar-item" data-book-id="${book.id}" onclick="triggerHaptic(); toggleSidebarBook('${book.id}')">
              <img src="${book.iconUrl}" class="sidebar-item-icon" onerror="this.style.display='none'">
              <span style="flex: 1;">${book.title}</span>
              <i class="fa-solid fa-chevron-down sidebar-arrow"></i>
            </div>
            <div class="sidebar-chapters-list">
        `;

        if (book.chapters && book.chapters.length > 0) {
          book.chapters.forEach(chap => {
            html += `
              <div class="sidebar-subitem" data-chap-id="${chap.id}" onclick="triggerHaptic(); sidebarGoChapter('${book.id}', '${chap.id}')">
                <i class="fa-solid fa-angle-right" style="font-size:0.75rem; color:var(--primary-color);"></i>
                <span>${chap.title}</span>
              </div>
            `;
          });
        }

        html += `
            </div>
          </div>
        `;
      });
      sidebarNav.innerHTML = html;
    }

    /* 需求 2: 電腦版左邊功能，當某一個展開，又展開下一個時，自動將其他已展開的收合 */
    function toggleSidebarBook(bookId) {
      const group = document.getElementById(`sidebarBookGroup-${bookId}`);
      if (!group) return;

      const isExpanded = group.classList.contains('expanded');

      // 先收合所有其他選單
      document.querySelectorAll('.sidebar-book-group').forEach(g => {
        if (g !== group) {
          g.classList.remove('expanded');
        }
      });

      if (isExpanded) {
        group.classList.remove('expanded');
      } else {
        group.classList.add('expanded');
        renderChapters(bookId);
      }
      updateSidebarActive(bookId);
    }

    function sidebarGoChapter(bookId, chapterId) {
      updateSidebarActive(bookId, chapterId);
      renderSections(bookId, chapterId);
    }

    function updateSidebarActive(bookId, chapterId) {
      if (!sidebarNav) return;
      sidebarNav.querySelectorAll('.sidebar-item, .sidebar-subitem').forEach(el => el.classList.remove('active'));
      
      if (!bookId) {
        const home = sidebarNav.querySelector('[data-nav-home]');
        if (home) home.classList.add('active');
      } else {
        const bookEl = sidebarNav.querySelector(`.sidebar-item[data-book-id="${bookId}"]`);
        if (bookEl) bookEl.classList.add('active');

        if (chapterId) {
          const chapEl = sidebarNav.querySelector(`.sidebar-subitem[data-chap-id="${chapterId}"]`);
          if (chapEl) chapEl.classList.add('active');
        }
      }
    }

    function sidebarGoHome() {
      searchInput.value = '';
      clearSearchBtn.style.display = 'none';
      searchContainer.classList.remove('active');
      if (navSearchBtn) navSearchBtn.classList.remove('active');
      // 點擊「總覽首頁」時，左側收合所有展開中的分類，回到最初的清單狀態
      document.querySelectorAll('.sidebar-book-group.expanded').forEach(g => {
        g.classList.remove('expanded');
      });
      renderHall();
    }

    function updateBottomNavHome(isHome) {
      if (navHomeBtn) navHomeBtn.classList.toggle('active', !!isHome);
    }

    function renderHall() {
      navigationStack = [];
      headerTitle.innerText = "加加研究室";
      backBtn.style.display = "none";
      updateSidebarActive(null);
      updateBottomNavHome(true);

      if (typeof courseData === 'undefined') {
        appContent.innerHTML = `<div class="empty-state"><p style="color:#d32f2f;">未找到 courseData 資料！</p></div>`;
        return;
      }

      let html = `<div class="grid-hall">`;
      courseData.forEach((item, index) => {
        html += `
          <div class="card" style="animation-delay: ${index * 0.03}s" onclick="triggerHaptic(); createRipple(event, this); renderChapters('${item.id}')">
            <img src="${item.iconUrl}" class="card-custom-img" alt="${item.title}" onerror="this.src='https://via.placeholder.com/44?text=Icon'">
            <div class="card-title">${item.title}</div>
          </div>
        `;
      });
      html += `</div>`;

      appContent.innerHTML = html;
    }

    function renderChapters(bookId) {
      const book = courseData.find(b => b.id === bookId);
      if (!book) return;

      const group = document.getElementById(`sidebarBookGroup-${bookId}`);
      if (group && !group.classList.contains('expanded')) {
        // 確保展開當前分類時收合其他分類
        document.querySelectorAll('.sidebar-book-group').forEach(g => {
          if (g !== group) g.classList.remove('expanded');
        });
        group.classList.add('expanded');
      }

      // 壓入退回大廳的紀錄
      navigationStack.push({ type: 'hall' });
      headerTitle.innerText = book.title;
      backBtn.style.display = "flex";
      updateSidebarActive(bookId);
      updateBottomNavHome(false);

      if (!book.chapters || book.chapters.length === 0) {
        renderEmptyState();
        return;
      }

      let html = `<div class="list-container">`;
      book.chapters.forEach((chap, index) => {
        html += `
          <div class="list-item" style="animation-delay: ${index * 0.04}s" onclick="triggerHaptic(); createRipple(event, this); renderSections('${book.id}', '${chap.id}')">
            <span class="list-title">${chap.title}</span>
            <i class="fa-solid fa-chevron-right" style="color:#aaa; font-size:0.8rem;"></i>
          </div>
        `;
      });
      html += `</div>`;

      appContent.innerHTML = html;
    }

    function renderSections(bookId, chapterId, parentSubIds = []) {
      const book = courseData.find(b => b.id === bookId);
      if (!book) return;

      let currentTarget = book.chapters.find(c => c.id === chapterId);
      for (const subId of parentSubIds) {
        if (currentTarget && currentTarget.subchapters) {
          currentTarget = currentTarget.subchapters.find(s => s.id === subId);
        }
      }

      if (!currentTarget) return;

      // 正確寫入返回歷史
      if (parentSubIds.length === 0) {
        navigationStack.push({ 
          type: 'chapters', 
          bookId: bookId 
        });
      } else {
        navigationStack.push({ 
          type: 'sections', 
          bookId: bookId, 
          chapterId: chapterId, 
          parentSubIds: parentSubIds.slice(0, -1) 
        });
      }

      headerTitle.innerText = currentTarget.title;
      backBtn.style.display = "flex";
      updateSidebarActive(bookId, chapterId);
      updateBottomNavHome(false);

      // 需求 4: 第3層 L1.3 - Esp32 進入後為圖卡應用不是清單樣式，包含圖片功能
      const isEsp32CardView = (chapterId === 'l1-3');

      // 情況 A：若底下還有子分類 (subchapters)
      if (currentTarget.subchapters && currentTarget.subchapters.length > 0) {
        if (isEsp32CardView) {
          let html = `<div class="grid-hall">`;
          currentTarget.subchapters.forEach((sub, index) => {
            const defaultCover = sub.iconUrl || sub.coverUrl || "https://via.placeholder.com/300x200/007bc7/ffffff?text=" + encodeURIComponent(sub.title);
            const nextSubIds = JSON.stringify([...parentSubIds, sub.id]).replace(/"/g, '&quot;');
            html += `
              <div class="section-card" style="animation-delay: ${index * 0.04}s" onclick="triggerHaptic(); createRipple(event, this); renderSections('${bookId}', '${chapterId}', ${nextSubIds})">
                <img src="${defaultCover}" class="section-card-cover" alt="${sub.title}" onerror="this.src='https://via.placeholder.com/300x200/007bc7/ffffff?text=ESP32'">
                <div class="section-card-body">
                  <div class="section-card-title">${sub.title}</div>
                  <div class="section-card-tag"><i class="fa-solid fa-folder-open"></i> 進入主題內容</div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
          appContent.innerHTML = html;
          return;
        } else {
          let html = `<div class="list-container">`;
          currentTarget.subchapters.forEach((sub, index) => {
            const nextSubIds = JSON.stringify([...parentSubIds, sub.id]).replace(/"/g, '&quot;');
            html += `
              <div class="list-item" style="animation-delay: ${index * 0.04}s" onclick="triggerHaptic(); createRipple(event, this); renderSections('${bookId}', '${chapterId}', ${nextSubIds})">
                <span class="list-title">${sub.title}</span>
                <i class="fa-solid fa-chevron-right" style="color:#aaa; font-size:0.8rem;"></i>
              </div>
            `;
          });
          html += `</div>`;
          appContent.innerHTML = html;
          return;
        }
      }

      // 情況 B：若底下是小章節 (sections)，依各自的建立方式（講義/影片/教學）顯示不同卡片樣式
      if (currentTarget.sections && currentTarget.sections.length > 0) {
        let html = `<div class="grid-hall">`;
        currentTarget.sections.forEach((sec, index) => {
          const mode = sec.mode || 'pdf';
          const meta = SECTION_MODE_META[mode] || SECTION_MODE_META.pdf;

          let coverImg = (sec.coverUrl && sec.coverUrl !== "") ? sec.coverUrl : '';
          if (!coverImg && mode === 'video') {
            const vid = getYoutubeVideoId(sec.videoUrl || '');
            if (vid) coverImg = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
          }
          if (!coverImg) coverImg = meta.defaultCover;

          const secPayload = JSON.stringify({
            id: sec.id || '',
            mode: mode,
            title: sec.title,
            pdfUrl: sec.pdfUrl || '',
            videoUrl: sec.videoUrl || '',
            videoNote: sec.videoNote || '',
            blocks: sec.blocks || [],
            buttons: sec.buttons || [],
            access: sec.access || 'public',
            accessPassword: sec.accessPassword || '',
            accessHint: sec.accessHint || ''
          }).replace(/"/g, '&quot;');

          const isLocked = (sec.access === 'password' && sec.accessPassword);

          html += `
            <div class="section-card" style="animation-delay: ${index * 0.04}s" onclick="triggerHaptic(); createRipple(event, this); openSection('${bookId}', '${chapterId}', ${secPayload})">
              <img src="${coverImg}" class="section-card-cover" alt="${sec.title}" onerror="this.src='${meta.defaultCover}'">
              <div class="section-card-body">
                <div class="section-card-title">${sec.title}</div>
                <div class="section-card-tag"><i class="${isLocked ? 'fa-solid fa-lock' : meta.icon}"></i> ${isLocked ? '需要密碼才能瀏覽' : meta.label}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
        appContent.innerHTML = html;
        return;
      }

      renderEmptyState();
    }

    // 小章節三種建立方式對應的卡片顯示樣式
    const SECTION_MODE_META = {
      pdf: { icon: 'fa-regular fa-file-pdf', label: '點擊閱讀講義', defaultCover: 'https://via.placeholder.com/300x200/007bc7/ffffff?text=PDF+Preview' },
      video: { icon: 'fa-solid fa-circle-play', label: '點擊觀看影片', defaultCover: 'https://via.placeholder.com/300x200/007bc7/ffffff?text=Video' },
      article: { icon: 'fa-solid fa-book-open', label: '點擊閱讀教學', defaultCover: 'https://via.placeholder.com/300x200/007bc7/ffffff?text=Article' }
    };

    // 依小章節的 mode 分派到對應的瀏覽器（講義 / 影片 / 教學），
    // 若該小章節設有密碼保護，先顯示密碼輸入畫面，驗證通過後才真正開啟內容。
    // 注意：不記住解鎖狀態——只要按「返回」離開，下次要再看同一節就要重新輸入密碼。
    function openSection(bookId, chapterId, sec) {
      if (sec.access === 'password' && sec.accessPassword) {
        renderPasswordGate(bookId, chapterId, sec);
      } else {
        dispatchOpenSection(bookId, chapterId, sec);
      }
    }

    function dispatchOpenSection(bookId, chapterId, sec) {
      const mode = sec.mode || 'pdf';
      if (mode === 'video') {
        openVideoViewer(bookId, chapterId, sec.title, sec.videoUrl, sec.videoNote, sec.buttons || []);
      } else if (mode === 'article') {
        openArticleViewer(bookId, chapterId, sec.title, sec.blocks || [], sec.buttons || []);
      } else {
        openPdfViewer(bookId, chapterId, sec.title, sec.pdfUrl, sec.buttons || []);
      }
    }

    // 記住目前等待輸入密碼的小章節內容，供密碼畫面的送出按鈕使用
    window.__pendingPasswordSection = null;

    function renderPasswordGate(bookId, chapterId, sec) {
      if (searchInput.value.trim() !== '') {
        navigationStack.push({ type: 'search' });
      } else {
        navigationStack.push({ type: 'sections', bookId: bookId, chapterId: chapterId });
      }

      headerTitle.innerText = sec.title;
      backBtn.style.display = "flex";
      updateSidebarActive(bookId, chapterId);
      updateBottomNavHome(false);

      window.__pendingPasswordSection = { bookId, chapterId, sec };

      appContent.innerHTML = `
        <div class="password-gate-container">
          <div class="password-gate-icon"><i class="fa-solid fa-lock"></i></div>
          <div class="password-gate-title">此內容需要密碼才能瀏覽</div>
          <div class="password-gate-sub">請輸入密碼以查看「${escapeHtmlText(sec.title)}」</div>
          <input type="password" id="sectionPasswordInput" class="password-gate-input" placeholder="請輸入密碼" autocomplete="off">
          ${sec.accessHint ? `<div class="password-gate-hint"><i class="fa-solid fa-lightbulb"></i> 提示：${escapeHtmlText(sec.accessHint)}</div>` : ''}
          <button type="button" class="password-gate-btn" onclick="submitSectionPassword()">確認送出</button>
          <div class="password-gate-error" id="sectionPasswordError"></div>
        </div>
      `;

      const pwdInput = document.getElementById('sectionPasswordInput');
      if (pwdInput) {
        pwdInput.focus();
        pwdInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') submitSectionPassword();
        });
      }
    }

    function submitSectionPassword() {
      const pending = window.__pendingPasswordSection;
      if (!pending) return;

      const input = document.getElementById('sectionPasswordInput');
      const errorEl = document.getElementById('sectionPasswordError');
      const value = input ? input.value : '';

      if (value === pending.sec.accessPassword) {
        window.__pendingPasswordSection = null;
        navigationStack.pop(); // 密碼畫面自己 push 的那筆歷史紀錄不需要重複保留，交由實際內容頁重新 push 一次
        dispatchOpenSection(pending.bookId, pending.chapterId, pending.sec);
      } else {
        if (errorEl) errorEl.textContent = '密碼不正確，請再試一次';
        if (input) {
          input.value = '';
          input.focus();
        }
      }
    }

    // 從各種可能的 YouTube 網址格式中取出影片 ID
    function getYoutubeVideoId(url) {
      if (!url) return '';
      const patterns = [
        /youtube\.com\/watch\?v=([\w-]{6,})/,
        /youtu\.be\/([\w-]{6,})/,
        /youtube\.com\/embed\/([\w-]{6,})/,
        /youtube\.com\/shorts\/([\w-]{6,})/
      ];
      for (const re of patterns) {
        const m = url.match(re);
        if (m) return m[1];
      }
      return '';
    }

    function getYoutubeEmbedUrl(url) {
      const id = getYoutubeVideoId(url);
      return id ? `https://www.youtube.com/embed/${id}` : (url || '');
    }

    function escapeHtmlText(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // 用於 HTML 屬性（如 src="..."）的跳脫，額外處理雙引號與單引號，避免破壞屬性或注入
    function escapeHtmlAttr(str) {
      return escapeHtmlText(str)
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 教學模式：程式碼框收合／展開（點擊標題列切換，預設展開）
    function toggleCodeBlock(headerEl) {
      const block = headerEl.closest('.article-block-code');
      if (block) block.classList.toggle('collapsed');
    }

    // 教學模式：圖片直接瀏覽燈箱
    function openImageLightbox(url) {
      if (!url) return;
      const overlay = document.getElementById('imageLightboxOverlay');
      const img = document.getElementById('imageLightboxImg');
      if (!overlay || !img) return;
      img.src = url;
      overlay.classList.add('active');
    }

    function closeImageLightbox() {
      const overlay = document.getElementById('imageLightboxOverlay');
      if (overlay) overlay.classList.remove('active');
    }

    // 將純文字中的網址自動轉為可點擊連結，其餘文字保持跳脫，避免注入
    function linkifyText(text) {
      if (!text) return '';
      const escaped = escapeHtmlText(text);
      const urlRegex = /(https?:\/\/[^\s<]+)/g;
      return escaped.replace(urlRegex, (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
    }

    // 依附件按鈕清單組出「分隔線 + 附件：按鈕...」區塊；沒有按鈕時回傳空字串（等同隱藏）
    function renderAttachmentButtons(buttons) {
      if (!Array.isArray(buttons) || buttons.length === 0) return '';

      const btnsHtml = buttons
        .filter(b => b && b.title && b.url)
        .map(b => `<a class="attachment-btn" href="${b.url}" target="_blank" rel="noopener noreferrer">${b.title}</a>`)
        .join('');

      if (btnsHtml === '') return '';

      return `
        <div class="attachment-divider"></div>
        <div class="attachment-section">
          <div class="attachment-label"><i class="fa-solid fa-paperclip"></i> 附件區：</div>
          <div class="attachment-buttons">${btnsHtml}</div>
        </div>
      `;
    }

    // 手機版的 PDF 講義 iframe 本身可上下捲動（Google 文件檢視器內建分頁/捲動），
    // 手指只要按在 iframe 範圍內滑動，觸控事件會被 iframe 整個吃掉、不會往外
    // 傳給外層頁面，導致外層頁面「滑不動」，永遠碰不到 iframe 下方固定不動的
    // 附件按鈕。與其要求使用者精準地在 iframe 以外的窄邊緣滑動，不如直接把
    // iframe 高度動態算到「剛好扣掉標題列、附件區、底部導覽列與版權列後」的
    // 剩餘高度，讓整頁一次就完整顯示在畫面內、完全不必捲動，附件按鈕自然隨
    // 時都點得到。
    function fitPdfViewerHeight() {
      if (document.body.classList.contains('desktop-mode')) return;
      const container = appContent.querySelector('.pdf-viewer-container');
      if (!container) return;

      requestAnimationFrame(() => {
        const headerEl = document.querySelector('.main-column > header');
        const footerEl = document.getElementById('footerText');
        const navEl = document.getElementById('bottomNav');
        const mainEl = appContent;
        const divider = appContent.querySelector('.attachment-divider');
        const attachSection = appContent.querySelector('.attachment-section');

        const mainStyles = window.getComputedStyle(mainEl);
        const mainPadding = (parseFloat(mainStyles.paddingTop) || 0) + (parseFloat(mainStyles.paddingBottom) || 0);

        const reserved =
          (headerEl ? headerEl.offsetHeight : 0) +
          mainPadding +
          (divider ? divider.offsetHeight + 32 : 0) +
          (attachSection ? attachSection.offsetHeight : 0) +
          (navEl ? navEl.offsetHeight : 0) +
          (footerEl ? footerEl.offsetHeight : 0);

        const appHeight = window.innerHeight;
        const minHeight = 320; // 講義內容過小時仍保留最低可讀高度，不足時允許頁面正常捲動
        const available = appHeight - reserved;
        container.style.height = Math.max(available, minHeight) + 'px';
      });
    }

    function openPdfViewer(bookId, chapterId, title, pdfUrl, buttons = []) {
      if (!pdfUrl || pdfUrl === "") {
        alert("該章節講義 PDF 準備中！");
        return;
      }

      if (searchInput.value.trim() !== '') {
        navigationStack.push({ type: 'search' });
      } else {
        navigationStack.push({ type: 'sections', bookId: bookId, chapterId: chapterId });
      }

      headerTitle.innerText = title;
      backBtn.style.display = "flex";
      updateSidebarActive(bookId, chapterId);
      updateBottomNavHome(false);

      appContent.innerHTML = `
        <div class="pdf-viewer-container">
          <iframe src="${pdfUrl}" allow="autoplay"></iframe>
        </div>
        ${renderAttachmentButtons(buttons)}
      `;

      fitPdfViewerHeight();
    }

    // 影片模式：播放 YouTube 影片 + 下方資訊欄（補充文字可點連結、禁止複製）
    function openVideoViewer(bookId, chapterId, title, videoUrl, videoNote, buttons = []) {
      if (!videoUrl || videoUrl === "") {
        alert("該章節影片準備中！");
        return;
      }

      if (searchInput.value.trim() !== '') {
        navigationStack.push({ type: 'search' });
      } else {
        navigationStack.push({ type: 'sections', bookId: bookId, chapterId: chapterId });
      }

      headerTitle.innerText = title;
      backBtn.style.display = "flex";
      updateSidebarActive(bookId, chapterId);
      updateBottomNavHome(false);

      const embedUrl = getYoutubeEmbedUrl(videoUrl);
      const noteHtml = linkifyText(videoNote || '');

      appContent.innerHTML = `
        <div class="video-viewer-container">
          <div class="video-aspect">
            <iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        </div>
        ${noteHtml ? `
          <div class="video-info-box">
            <div class="video-info-label"><i class="fa-solid fa-circle-info"></i> 補充說明</div>
            <div class="video-info-text">${noteHtml}</div>
          </div>
        ` : ''}
        ${renderAttachmentButtons(buttons)}
      `;
    }

    // 教學模式：依序渲染文字 / PDF / 影片 / 程式碼區塊，像部落格文章一樣
    function renderArticleBlockHtml(block, idx) {
      const type = block.type;
      const content = block.content || '';

      if (type === 'text') {
        return `<div class="article-block"><div class="article-block-text">${linkifyText(content)}</div></div>`;
      }
      if (type === 'pdf') {
        return `<div class="article-block"><div class="article-block-pdf"><iframe src="${content}" allow="autoplay"></iframe></div></div>`;
      }
      if (type === 'video') {
        const embedUrl = getYoutubeEmbedUrl(content);
        return `<div class="article-block"><div class="article-block-video"><iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></div>`;
      }
      if (type === 'image') {
        const safeUrl = escapeHtmlAttr(content);
        return `
          <div class="article-block">
            <div class="article-block-image" onclick="openImageLightbox('${safeUrl}')">
              <img src="${safeUrl}" alt="圖片" loading="lazy">
              <span class="article-image-hint"><i class="fa-solid fa-magnifying-glass-plus"></i> 點擊放大瀏覽</span>
            </div>
          </div>
        `;
      }
      if (type === 'code') {
        const codeId = `articleCode_${idx}_${Math.random().toString(36).slice(2)}`;
        return `
          <div class="article-block">
            <div class="article-block-code code-copyable">
              <div class="code-header" onclick="toggleCodeBlock(this)">
                <span class="code-header-label"><i class="fa-solid fa-code"></i> 程式碼</span>
                <div class="code-header-actions">
                  <button type="button" class="article-code-copy-btn" onclick="event.stopPropagation(); copyArticleCode('${codeId}', this)">複製程式碼</button>
                  <i class="fa-solid fa-chevron-down code-toggle-icon"></i>
                </div>
              </div>
              <div class="code-body"><div><pre><code id="${codeId}">${escapeHtmlText(content)}</code></pre></div></div>
            </div>
          </div>
        `;
      }
      return '';
    }

    // 程式碼框允許複製：點擊按鈕直接複製到剪貼簿
    function copyArticleCode(codeId, btn) {
      const el = document.getElementById(codeId);
      if (!el) return;
      const text = el.innerText;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          const original = btn.textContent;
          btn.textContent = '已複製！';
          setTimeout(() => { btn.textContent = original; }, 1500);
        }).catch(() => {});
      }
    }

    function openArticleViewer(bookId, chapterId, title, blocks = [], buttons = []) {
      if (!Array.isArray(blocks) || blocks.length === 0) {
        alert("該章節教學內容準備中！");
        return;
      }

      if (searchInput.value.trim() !== '') {
        navigationStack.push({ type: 'search' });
      } else {
        navigationStack.push({ type: 'sections', bookId: bookId, chapterId: chapterId });
      }

      headerTitle.innerText = title;
      backBtn.style.display = "flex";
      updateSidebarActive(bookId, chapterId);
      updateBottomNavHome(false);

      const blocksHtml = blocks.map((b, idx) => renderArticleBlockHtml(b, idx)).join('');

      appContent.innerHTML = `
        <div class="article-container">${blocksHtml}</div>
        ${renderAttachmentButtons(buttons)}
      `;
    }

    // 將搜尋輸入拆成多個關鍵字：支援空白、「+」、全形／半形逗號、頓號作為分隔符
    // 例如輸入「A + 骰」會拆成 ["a", "骰"]，用來做多關鍵字交集(AND)比對
    function parseSearchKeywords(raw) {
      return raw
        .split(/[+\s,，、]+/)
        .map(s => s.trim().toLowerCase())
        .filter(Boolean);
    }

    function handleSearch() {
      const rawQuery = searchInput.value.trim();
      const query = rawQuery.toLowerCase();

      if (query === '') {
        clearSearchBtn.style.display = 'none';
        goBackToCurrentStack();
        return;
      }

      clearSearchBtn.style.display = 'block';
      backBtn.style.display = "flex";
      headerTitle.innerText = "搜尋結果";
      updateSidebarActive(null);
      updateBottomNavHome(false);
      if (sidebarNav) {
        const home = sidebarNav.querySelector('[data-nav-home]');
        if (home) home.classList.remove('active');
      }

      const keywords = parseSearchKeywords(query);
      // 防呆：理論上不會發生（query 已確認非空字串），仍保留原始查詢當作備援關鍵字
      const effectiveKeywords = keywords.length > 0 ? keywords : [query];

      const preciseResults = [];
      const fuzzyResults = [];

      // 依「父層（課程）＋子層（章節路徑）」組成完整比對文字，讓多關鍵字可以
      // 跨層級比對（例如 "A" 命中課程名、"骰" 命中小章節名，兩者交集才算精準符合）
      function classifyNode(type, bookTitle, bookIcon, chainTitles, action) {
        const ownTitle = chainTitles[chainTitles.length - 1];
        const ownTitleLower = ownTitle.toLowerCase();
        const combinedText = (bookTitle + ' ' + chainTitles.join(' ')).toLowerCase();

        const allInCombined = effectiveKeywords.every(k => combinedText.includes(k));
        const anyInCombined = effectiveKeywords.some(k => combinedText.includes(k));

        if (!allInCombined && !anyInCombined) return;

        const resultObj = {
          type,
          bookTitle,
          bookIcon: bookIcon || '',
          ownTitle,
          ownMatched: effectiveKeywords.every(k => ownTitleLower.includes(k)),
          action
        };

        if (allInCombined) preciseResults.push(resultObj);
        else fuzzyResults.push(resultObj);
      }

      courseData.forEach(book => {
        classifyNode('book', book.title, book.iconUrl, [book.title], () => renderChapters(book.id));

        function searchSubchapters(list, chainTitles) {
          list.forEach(item => {
            const newChain = [...chainTitles, item.title];
            classifyNode('chapter', book.title, book.iconUrl, newChain, () => renderSections(book.id, item.id));

            if (item.subchapters) searchSubchapters(item.subchapters, newChain);
            if (item.sections) {
              item.sections.forEach(sec => {
                classifyNode('section', book.title, book.iconUrl, [...newChain, sec.title], () => openSection(book.id, item.id, sec));
              });
            }
          });
        }

        if (book.chapters) {
          searchSubchapters(book.chapters, [book.title]);
        }
      });

      // 精準結果內，本身標題就完全命中的排在前面，跨層級才交集命中的排在後面
      preciseResults.sort((a, b) => (b.ownMatched ? 1 : 0) - (a.ownMatched ? 1 : 0));

      if (preciseResults.length === 0 && fuzzyResults.length === 0) {
        appContent.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-magnifying-glass" style="font-size:2.5rem; margin-bottom:12px; color:#aaa;"></i>
            <p>找不到與「${escapeHtmlText(rawQuery)}」相關的內容</p>
          </div>
        `;
        window.currentSearchResults = [];
        return;
      }

      function iconClassFor(type) {
        if (type === 'chapter') return 'fa-folder-open';
        if (type === 'section') return 'fa-file-pdf';
        return 'fa-book';
      }

      // 左側課程圖示 + 右側主副標題（父層課程名為主標題，子層章節為副標題）
      function renderResultItem(res, flatIndex) {
        const iconClass = iconClassFor(res.type);
        const subLine = res.type === 'book'
          ? `<i class="fa-solid ${iconClass}"></i> 課程主分類`
          : `<i class="fa-solid ${iconClass}"></i> <span class="search-arrow">↳</span> ${escapeHtmlText(res.ownTitle)}`;
        const fallbackIcon = 'https://via.placeholder.com/64/007bc7/ffffff?text=' + encodeURIComponent(res.bookTitle.charAt(0) || '?');

        return `
          <div class="list-item" style="animation-delay: ${flatIndex * 0.03}s" onclick="triggerHaptic(); createRipple(event, this); executeSearchResult(this)" data-func-id="${flatIndex}">
            <div class="search-result-main">
              <img src="${escapeHtmlAttr(res.bookIcon)}" class="search-result-icon" alt="${escapeHtmlAttr(res.bookTitle)}" onerror="this.src='${fallbackIcon}'">
              <div class="search-result-text">
                <div class="search-result-title">${escapeHtmlText(res.bookTitle)}</div>
                <span class="search-result-sub">${subLine}</span>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right" style="color:#aaa; font-size:0.8rem; flex-shrink:0;"></i>
          </div>
        `;
      }

      const combinedResults = [...preciseResults, ...fuzzyResults];
      let html = '';

      if (preciseResults.length > 0) {
        html += `
          <div class="search-group-label">
            <i class="fa-solid fa-bolt"></i> 智能搜尋 <span class="search-group-count">（${preciseResults.length} 筆精準結果）</span>
          </div>
        `;
        html += `<div class="list-container">`;
        preciseResults.forEach((res, i) => { html += renderResultItem(res, i); });
        html += `</div>`;
      }

      if (fuzzyResults.length > 0) {
        if (preciseResults.length > 0) html += `<hr class="search-group-divider">`;
        html += `
          <div class="search-group-label fuzzy">
            <i class="fa-solid fa-wand-magic-sparkles"></i> 類似結果 <span class="search-group-count">（${fuzzyResults.length} 筆相關結果）</span>
          </div>
        `;
        html += `<div class="list-container">`;
        fuzzyResults.forEach((res, i) => { html += renderResultItem(res, preciseResults.length + i); });
        html += `</div>`;
      }

      appContent.innerHTML = html;
      window.currentSearchResults = combinedResults;
    }

    function executeSearchResult(element) {
      const index = element.getAttribute('data-func-id');
      if (window.currentSearchResults && window.currentSearchResults[index]) {
        navigationStack.push({ type: 'search' });
        window.currentSearchResults[index].action();
        searchInput.value = '';
        clearSearchBtn.style.display = 'none';
        searchContainer.classList.remove('active');
        if (navSearchBtn) navSearchBtn.classList.remove('active');
      }
    }

    function clearSearch() {
      searchInput.value = '';
      clearSearchBtn.style.display = 'none';
      goBackToCurrentStack();
    }

    function goBackToCurrentStack() {
      if (navigationStack.length === 0) {
        renderHall();
      } else {
        goBack();
      }
    }

    function renderEmptyState() {
      appContent.innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-pen-ruler" style="font-size:2.5rem; margin-bottom:12px; color:#aaa;"></i>
          <p>單元講義建置中，敬請期待！</p>
        </div>
      `;
    }

    function goBack() {
      if (searchInput.value.trim() !== '' && navigationStack.length === 0) {
        clearSearch();
        return;
      }

      if (navigationStack.length === 0) {
        renderHall();
        return;
      }

      const lastState = navigationStack.pop();

      if (lastState.type === 'search') {
        handleSearch();
      } else if (lastState.type === 'hall') {
        searchInput.value = '';
        renderHall();
      } else if (lastState.type === 'chapters') {
        renderChapters(lastState.bookId);
      } else if (lastState.type === 'sections') {
        renderSections(lastState.bookId, lastState.chapterId, lastState.parentSubIds || []);
      }
    }

    function goHomeFromNav() {
      searchInput.value = '';
      clearSearchBtn.style.display = 'none';
      searchContainer.classList.remove('active');
      if (navSearchBtn) navSearchBtn.classList.remove('active');
      renderHall();
    }

    window.onload = function() {
      setAppHeight();
      setBottomNavSpace();
      applyRandomTheme();
      document.getElementById('footerText').innerText = `© 加加研究室 - 創客教學網頁`;
      renderSidebarNav();
      refreshNoticeBadge();
      renderHall();
      fitHeaderTitle();
    };
  </script>

  <!-- =========================================================
       內容保護模組（本區塊為新增，未修改上方任何原有程式碼與架構）
       1. 嚴格禁用開發者工具 (F12 / Console 防禦)
       2. 快捷鍵與滑鼠/觸控事件全面封鎖
       3. 動態網址保護與 Blob 加密載入（PDF 講義）
       4. 防止右鍵選單、拖曳，並強化手機端防惡意下載
       ========================================================= -->
  <script>
  (function () {
    'use strict';

    /* ---------- 0. 動態注入保護樣式與警告遮罩（不更動原始 <head>/<body>） ---------- */
    var protectStyle = document.createElement('style');
    protectStyle.id = 'security-protection-style';
    protectStyle.textContent =
      'html, body, * {' +
      '  -webkit-user-select: none !important;' +
      '  -moz-user-select: none !important;' +
      '  -ms-user-select: none !important;' +
      '  user-select: none !important;' +
      '}' +
      'input, textarea, [contenteditable="true"] {' +
      '  -webkit-user-select: text !important;' +
      '  -moz-user-select: text !important;' +
      '  -ms-user-select: text !important;' +
      '  user-select: text !important;' +
      '}' +
      'img, iframe, video, canvas {' +
      '  -webkit-user-drag: none !important;' +
      '  -khtml-user-drag: none !important;' +
      '  -moz-user-drag: none !important;' +
      '  user-drag: none !important;' +
      '  -webkit-touch-callout: none !important;' +
      '}' +
      '#devtoolsWarningOverlay {' +
      '  display: none;' +
      '  position: fixed;' +
      '  inset: 0;' +
      '  background: #0b0b0f;' +
      '  color: #fff;' +
      '  z-index: 2147483647;' +
      '  flex-direction: column;' +
      '  align-items: center;' +
      '  justify-content: center;' +
      '  text-align: center;' +
      '  padding: 24px;' +
      '  font-size: 1.05rem;' +
      '  line-height: 1.8;' +
      '}' +
      '#devtoolsWarningOverlay.active { display: flex; }' +
      '#pdfLoadingMask {' +
      '  position: absolute;' +
      '  inset: 0;' +
      '  display: flex;' +
      '  align-items: center;' +
      '  justify-content: center;' +
      '  background: #fff;' +
      '  color: #666;' +
      '  font-size: 0.95rem;' +
      '  z-index: 3;' +
      '}' +
      '@media print { body * { display: none !important; } }';
    document.head.appendChild(protectStyle);

    var overlay = document.createElement('div');
    overlay.id = 'devtoolsWarningOverlay';
    overlay.innerHTML =
      '<i class="fa-solid fa-triangle-exclamation" style="font-size:2.4rem;margin-bottom:14px;color:#f1c40f;"></i>' +
      '<div>偵測到開發者工具已開啟<br>為保護課程講義內容，請先關閉開發者工具再繼續瀏覽</div>';

    function mountOverlay() {
      if (document.body && !document.body.contains(overlay)) {
        document.body.appendChild(overlay);
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mountOverlay);
    } else {
      mountOverlay();
    }

    /* ---------- 1. 防止右鍵選單 / 拖曳 / 選取（保留輸入框可正常輸入與貼上） ---------- */
    function isEditable(target) {
      if (!target || !target.tagName) return false;
      var tag = target.tagName;
      // 教學模式的程式碼框 (.code-copyable) 明確允許選取、右鍵與複製
      if (typeof target.closest === 'function' && target.closest('.code-copyable')) return true;
      return tag === 'INPUT' || tag === 'TEXTAREA' || target.isContentEditable;
    }

    document.addEventListener('contextmenu', function (e) {
      if (!isEditable(e.target)) e.preventDefault();
    }, true);

    document.addEventListener('dragstart', function (e) {
      if (!isEditable(e.target)) e.preventDefault();
    }, true);

    document.addEventListener('selectstart', function (e) {
      if (!isEditable(e.target)) e.preventDefault();
    }, true);

    // 行動裝置：攔截長按觸發的系統選單（另存圖片 / 分享等）
    var touchTimer = null;
    document.addEventListener('touchstart', function (e) {
      if (isEditable(e.target)) return;
      touchTimer = setTimeout(function () {
        if (e.cancelable) e.preventDefault();
      }, 500);
    }, { passive: false });
    document.addEventListener('touchend', function () { clearTimeout(touchTimer); }, { passive: true });
    document.addEventListener('touchmove', function () { clearTimeout(touchTimer); }, { passive: true });

    /* ---------- 2. 快捷鍵全面封鎖 ---------- */
    document.addEventListener('keydown', function (e) {
      var key = (e.key || '').toUpperCase();
      var blocked = false;

      if (key === 'F12') blocked = true;
      if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'K', 'E'].indexOf(key) !== -1) blocked = true; // 開發者工具/主控台/網路
      if (e.metaKey && e.altKey && ['I', 'J', 'C'].indexOf(key) !== -1) blocked = true; // macOS Safari
      if (e.ctrlKey && ['U', 'S', 'P'].indexOf(key) !== -1) blocked = true; // 檢視原始碼 / 儲存 / 列印
      if (e.ctrlKey && key === 'C' && !isEditable(e.target)) blocked = true; // 一般複製（輸入框仍可複製/貼上）

      if (blocked) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }, true);

    /* ---------- 3. 開發者工具偵測（視窗尺寸差 + debugger 中斷計時法） ---------- */
    var THRESHOLD = 170;
    var sizeSuspect = false;
    var timingSuspect = false;

    function updateOverlay() {
      overlay.classList.toggle('active', sizeSuspect || timingSuspect);
    }

    function checkBySize() {
      sizeSuspect =
        (window.outerWidth - window.innerWidth > THRESHOLD) ||
        (window.outerHeight - window.innerHeight > THRESHOLD);
      updateOverlay();
    }

    function checkByTiming() {
      var start = performance.now();
      // eslint-disable-next-line no-debugger
      debugger;
      timingSuspect = (performance.now() - start) > 100;
      updateOverlay();
    }

    // 桌機環境進行較嚴格偵測；行動裝置螢幕比例差異大，避免誤判改用其他防護手段
    if (!('ontouchstart' in window)) {
      setInterval(checkBySize, 800);
      setInterval(checkByTiming, 1200);
      window.addEventListener('resize', checkBySize);
    }

    /* ---------- 4. PDF 講義 Blob 動態載入（覆寫 openPdfViewer，行為與原本完全相容） ---------- */
    var activeBlobUrl = null;

    function releaseActiveBlobUrl() {
      if (activeBlobUrl) {
        URL.revokeObjectURL(activeBlobUrl);
        activeBlobUrl = null;
      }
    }

    // Google Drive / Docs 的 /preview 網址回傳的是設計給 iframe 嵌入的「檢視器網頁(HTML)」，
    // 不是原始 PDF 位元組，絕對不能拿去 fetch() 再包成 blob——那樣做只會把 HTML 內容
    // 誤標成 application/pdf，導致瀏覽器判定檔案無法辨識而顯示封鎖/錯誤畫面。
    function isDirectPdfFileUrl(url) {
      return !/drive\.google\.com|docs\.google\.com/i.test(url);
    }

    window.openPdfViewer = function (bookId, chapterId, title, pdfUrl, buttons) {
      if (!pdfUrl || pdfUrl === '') {
        alert('該章節講義 PDF 準備中！');
        return;
      }

      if (searchInput.value.trim() !== '') {
        navigationStack.push({ type: 'search' });
      } else {
        navigationStack.push({ type: 'sections', bookId: bookId, chapterId: chapterId });
      }

      headerTitle.innerText = title;
      backBtn.style.display = 'flex';
      updateSidebarActive(bookId, chapterId);
      updateBottomNavHome(false);

      releaseActiveBlobUrl();

      var attachmentsHtml = (typeof renderAttachmentButtons === 'function')
        ? renderAttachmentButtons(buttons || [])
        : '';

      appContent.innerHTML =
        '<div class="pdf-viewer-container" style="position:relative;">' +
        '<div id="pdfLoadingMask"><i class="fa-solid fa-spinner fa-spin" style="margin-right:8px;"></i>講義載入中...</div>' +
        '</div>' +
        attachmentsHtml;

      var container = appContent.querySelector('.pdf-viewer-container');

      if (!isDirectPdfFileUrl(pdfUrl)) {
        // Drive/Docs 檢視器頁面：直接嵌入，讓 Google 自己的頁面渲染 PDF 內容
        container.innerHTML =
          '<iframe src="' + pdfUrl + '" allow="autoplay" ' +
          'style="width:100%;height:100%;border:none;"></iframe>';
        return;
      }

      // 動態網址：附加一次性亂數參數，避免快取與直接分享同一組固定連結
      var dynamicUrl = pdfUrl + (pdfUrl.indexOf('?') === -1 ? '?' : '&') +
        '_t=' + Date.now() + Math.random().toString(36).slice(2);

      fetch(dynamicUrl, { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('讀取失敗');
          return res.blob();
        })
        .then(function (blob) {
          var pdfBlob = blob.slice(0, blob.size, 'application/pdf');
          activeBlobUrl = URL.createObjectURL(pdfBlob);
          var iframe = document.createElement('iframe');
          iframe.src = activeBlobUrl + '#toolbar=0&navpanes=0&statusbar=0';
          iframe.setAttribute('allow', 'autoplay');
          iframe.style.width = '100%';
          iframe.style.height = '100%';
          iframe.style.border = 'none';
          container.innerHTML = '';
          container.appendChild(iframe);
        })
        .catch(function () {
          // 若來源不支援跨網域 Blob 讀取，自動退回原始直接載入方式，確保功能不中斷
          container.innerHTML =
            '<iframe src="' + pdfUrl + '#toolbar=0&navpanes=0" allow="autoplay" ' +
            'style="width:100%;height:100%;border:none;"></iframe>';
        });
    };

    // 返回上一頁時釋放 Blob，避免產生的暫存連結被重複取用
    var originalGoBack = window.goBack;
    if (typeof originalGoBack === 'function') {
      window.goBack = function () {
        releaseActiveBlobUrl();
        return originalGoBack.apply(this, arguments);
      };
    }
    window.addEventListener('beforeunload', releaseActiveBlobUrl);

  })();
  </script>
