<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加加研究室 - 頁面轉向中</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ccplus2561/ccplus2561.github.io/main/ccplus2561_logo.png">
  <script>
    // GitHub Pages 對不存在的路徑（例如分享連結 /60924020101）都會導到這頁，
    // 這裡把路徑轉成查詢字串導回首頁，讓 index.html 讀取並跳轉到對應內容。
    (function () {
      var path = location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
      if (path) {
        location.replace('/?cid=' + encodeURIComponent(path));
      } else {
        location.replace('/' + location.search);
      }
    })();
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #e7f1fc 0%, #eef1fb 50%, #f3eafb 100%);
      color: #2c3e50;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0, 90, 147, 0.18);
      overflow: hidden;
      text-align: center;
      animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card-top {
      background: linear-gradient(135deg, #005a93, #007bc7);
      padding: 28px 20px 22px;
      color: #ffffff;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 18px;
      background: #ffffff;
      padding: 8px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    .site-name {
      margin-top: 12px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .site-sub {
      margin-top: 2px;
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .card-body {
      padding: 26px 24px 28px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 4px solid rgba(0, 123, 199, 0.18);
      border-top-color: #007bc7;
      animation: spin 0.9s linear infinite;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #005a93;
    }

    .desc {
      margin-top: 8px;
      font-size: 0.9rem;
      line-height: 1.7;
      color: #666666;
    }

    .id-chip {
      display: none;
      margin-top: 14px;
      padding: 8px 14px;
      border-radius: 12px;
      background: #f0f6fc;
      border: 1px dashed rgba(0, 123, 199, 0.45);
      font-size: 0.85rem;
      color: #2c3e50;
      word-break: break-all;
    }

    .id-chip b {
      color: #007bc7;
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    /* 若轉向超過 3 秒仍未完成，才顯示備用說明與按鈕 */
    .fallback {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px dashed rgba(0, 0, 0, 0.12);
      opacity: 0;
      animation: fadeIn 0.5s ease 3s forwards;
    }

    .fallback p {
      font-size: 0.82rem;
      line-height: 1.6;
      color: #888888;
    }

    .home-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 26px;
      border-radius: 999px;
      background: linear-gradient(135deg, #005a93, #007bc7);
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 6px 14px rgba(0, 123, 199, 0.3);
    }

    .home-btn:active {
      transform: scale(0.97);
    }

    noscript .desc {
      color: #c0392b;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(16px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-top">
      <img class="logo" alt="加加研究室"
           src="https://raw.githubusercontent.com/ccplus2561/ccplus2561.github.io/main/ccplus2561_logo.png"
           onerror="this.style.display='none'">
      <div class="site-name">加加研究室</div>
      <div class="site-sub">程式創造++ 創客教學網頁</div>
    </div>

    <div class="card-body">
      <div class="spinner"></div>
      <div class="title">正在為您開啟內容</div>
      <p class="desc">頁面轉向中，請稍候...<br>系統會自動帶您前往對應的教學內容。</p>

      <div class="id-chip" id="idChip">分享內容 ID：<b id="idText"></b></div>

      <noscript>
        <p class="desc">您的瀏覽器已停用 JavaScript，請點擊下方按鈕前往首頁，再使用搜尋功能輸入內容 ID。</p>
      </noscript>

      <div class="fallback">
        <p>如果超過數秒仍未自動跳轉，<br>請點擊下方按鈕回到首頁，並可在搜尋框直接輸入內容 ID 尋找文章。</p>
        <a class="home-btn" href="/">回到首頁</a>
      </div>
    </div>
  </div>

  <script>
    // 僅用於在等待畫面上顯示要開啟的內容 ID（不影響上方的轉向邏輯）
    (function () {
      var path = location.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
      if (!path) return;
      var chip = document.getElementById('idChip');
      var text = document.getElementById('idText');
      if (chip && text) {
        text.textContent = path;
        chip.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
