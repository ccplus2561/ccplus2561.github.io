<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101b32">
  <title>頁面導向中｜加加研究室</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/ccplus2561_logo_512.png">
  <link rel="apple-touch-icon" href="/assets/images/ccplus2561_logo_512.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #edf4ff; background: radial-gradient(ellipse at 50% 15%, #1d3c68 0, transparent 43%), linear-gradient(135deg, #101b32, #142746); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; text-align: center; }
    .box { width: min(100%, 440px); padding: 42px 30px; border: 1px solid rgba(193,218,250,.16); border-radius: 22px; background: rgba(19,39,67,.72); box-shadow: 0 26px 80px rgba(0,0,0,.22); }
    .logo { width: 62px; height: 62px; margin-bottom: 22px; border-radius: 50%; background: transparent; box-shadow: 0 8px 22px rgba(0,0,0,.2); }
    .spin { width: 38px; height: 38px; margin: 0 auto 20px; border: 3px solid rgba(113,174,255,.2); border-top-color: #72b3ff; border-radius: 50%; animation: spin .9s linear infinite; }
    h1 { margin: 0 0 10px; font-size: 19px; letter-spacing: .02em; }
    p { margin: 0; color: #a9bad1; font-size: 12px; line-height: 1.8; }
    a { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 42px; margin-top: 24px; padding: 0 17px; border-radius: 10px; color: #fff; background: #347df4; text-decoration: none; font-size: 12px; font-weight: 750; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>
  <script>
    // GitHub Pages 404 router: keep legacy aliases and article-ID routing.
    (function () {
      var BLOG = '/blog/';
      var HOME = '/';
      var path = '';
      try { path = decodeURIComponent(location.pathname); }
      catch (error) { path = location.pathname; }
      path = path.replace(/^\/+|\/+$/g, '');
      var parts = path.split('/');
      var first = parts[0];

      // Short aliases are case-insensitive.
      var ALIASES = {
        '部落': BLOG,
        'game': '/MiniHub/',
        'games': '/MiniHub/'
      };
      var aliasKey = first.toLowerCase();
      if (parts.length === 1 && Object.prototype.hasOwnProperty.call(ALIASES, aliasKey)) {
        location.replace(ALIASES[aliasKey]);
        return;
      }

      // Numeric article IDs: /609180302 or the legacy /?cid=609180302.
      var id = null;
      if (/^\d+$/.test(first) && parts.length === 1) {
        id = first;
      } else {
        var match = location.search.match(/[?&]cid=(\d+)/);
        if (match && path === '') id = match[1];
      }

      if (id) {
        fetch(BLOG + 'Data.js', { cache: 'no-cache' })
          .then(function (response) { return response.ok ? response.text() : Promise.reject(new Error('Blog data unavailable')); })
          .then(function (source) {
            var found = new RegExp('"id"\\s*:\\s*"' + id + '"').test(source);
            location.replace(found ? BLOG + '?cid=' + id : HOME);
          })
          .catch(function () {
            // Preserve the original fallback: let the blog handle an unavailable data file.
            location.replace(BLOG + '?cid=' + id);
          });
        return;
      }

      // All other missing paths return to the project hub.
      location.replace(HOME);
    })();
  </script>
</head>
<body>
  <main class="box">
    <img class="logo" src="/assets/images/ccplus2561_logo.png" alt="加加研究室">
    <div class="spin" aria-hidden="true"></div>
    <h1>正在為你導向正確頁面</h1>
    <p>正在確認短網址或文章連結。若沒有自動跳轉，請使用下方按鈕返回專案首頁。</p>
    <a href="/">回到加加研究室首頁 <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
