<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>加加研究室 - 頁面轉向中</title>
<link rel="icon" type="image/png" href="/ccplus2561_logo.png">
<script>
  // 中繼站路由：GitHub Pages 遇到不存在的路徑都會進這頁
  // 規則：只有「存在的文章 ID」「/部落」會轉走，其餘一律回中繼站大廳
  (function () {
    var BLOG = '/blog/';                       // 部落格 repo 名稱（若取別的名字，改這裡）
    var HOME = '/';
    var path = '';
    try { path = decodeURIComponent(location.pathname); } catch (e) { path = location.pathname; }
    path = path.replace(/^\/+|\/+$/g, '');
    var parts = path.split('/');
    var first = parts[0];

    // 1. 別名表：短網址 → 實際位置（要新增短網址，在這裡多加一行即可）
    //    key 一律用小寫；比對時不分大小寫，所以 /Game、/GAME 也能用
    var ALIASES = {
      '部落': BLOG,          // /部落  → 部落格大廳
      'game': '/MiniHub/',   // /game  → MiniHub 遊戲平台
      'games': '/MiniHub/'   // /games → MiniHub 遊戲平台
    };
    if (parts.length === 1 && ALIASES.hasOwnProperty(first.toLowerCase())) {
      location.replace(ALIASES[first.toLowerCase()]);
      return;
    }

    // 2. 取出文章 ID：/609180302 或舊版 ?cid=609180302
    var id = null;
    if (/^\d+$/.test(first) && parts.length === 1) id = first;
    else {
      var m = location.search.match(/[?&]cid=(\d+)/);
      if (m && path === '') id = m[1];
    }

    if (id) {
      // 先確認這個 ID 真的存在於部落格資料，存在才轉址，否則回大廳
      fetch(BLOG + 'Data.js', { cache: 'no-cache' })
        .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
        .then(function (t) {
          var found = new RegExp('"id"\\s*:\\s*"' + id + '"').test(t);
          location.replace(found ? BLOG + '?cid=' + id : HOME);
        })
        .catch(function () {
          // 讀不到資料時，保守起見仍交給部落格處理
          location.replace(BLOG + '?cid=' + id);
        });
      return;
    }

    // 3. 其他一律回中繼站大廳
    location.replace(HOME);
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(135deg,#e7f1fc,#eef1fb 50%,#f3eafb);color:#2c3e50;text-align:center}
  .box{padding:32px}
  .spin{width:44px;height:44px;margin:0 auto 16px;border-radius:50%;border:4px solid rgba(0,123,199,.18);
    border-top-color:#007bc7;animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:#007bc7}
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <div>頁面轉向中，請稍候…</div>
    <p style="font-size:.85rem;color:#888">若未自動跳轉，請<a href="/">回到首頁</a></p>
  </div>
</body>
</html>
